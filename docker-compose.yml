version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: whatadeal-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whatadeal
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: whatadeal-api
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/whatadeal?schema=public
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@postgres:5432/whatadeal?schema=public
      JWT_SECRET: your-jwt-secret-change-in-production
      JWT_REFRESH_SECRET: your-refresh-secret-change-in-production
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      PORT: 3000
      NODE_ENV: production
    depends_on:
      - postgres

volumes:
  postgres_data:
